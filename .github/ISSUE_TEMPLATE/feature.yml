name: Feature request
description: Idea for AgentForge
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: Keep localhost / shared-VM constraints in mind
      placeholder: In scope for this repo? Or private product track?
