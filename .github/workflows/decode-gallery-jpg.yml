name: decode-gallery-jpg
on:
  workflow_dispatch:
  push:
    paths:
      - ".sync-gallery/manifest.json"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode JPEGs and remove sync junk
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, base64, hashlib, shutil
          from pathlib import Path
          man = json.loads(Path('.sync-gallery/manifest.json').read_text())
          for f in man['files']:
              parts = [(Path('.sync-gallery') / n).read_text().strip() for n in f['parts']]
              data = base64.b64decode(''.join(parts))
              digest = hashlib.sha256(data).hexdigest()
              if digest != f['sha256']:
                  raise SystemExit(f"sha256 mismatch for {f['dest']}: {digest} != {f['sha256']}")
              dest = Path(f['dest'])
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(data)
              print(f"wrote {dest} ({len(data)} bytes)")
          shutil.rmtree('.sync-gallery', ignore_errors=True)
          Path('media/agents.jpg.b64').unlink(missing_ok=True)
          Path('media/_tiny_probe.jpg').unlink(missing_ok=True)
          for p in ['.agentforge-size-probe.txt', '.agentforge-sync-probe', 'baseline.json',
                    '.github/workflows/assemble-sync.yml', '.github/workflows/decode-gallery-jpg.yml']:
              Path(p).unlink(missing_ok=True)
          shutil.rmtree('.sync', ignore_errors=True)
          print('cleaned junk')
          PY
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "mehmet turac"
          git config user.email "mehmetturac@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: add README gallery images and clean sync artifacts"
          git pull --rebase origin main
          git push
