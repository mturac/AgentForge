name: assemble-sync
on:
  push:
    paths:
      - ".sync/manifest.json"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble .sync parts into target files
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, base64, hashlib
          from pathlib import Path
          man = json.loads(Path(".sync/manifest.json").read_text())
          changed = []
          for a in man["assemblies"]:
              missing = [n for n in a["parts"] if not (Path(".sync") / n).exists()]
              if missing:
                  print(f"skip {a['dest']}: missing {len(missing)} parts")
                  continue
              parts = [(Path(".sync") / n).read_bytes() for n in a["parts"]]
              if a["encoding"] == "base64":
                  data = base64.b64decode(b"".join(parts))
              else:
                  data = b"".join(parts)
              digest = hashlib.sha256(data).hexdigest()
              if digest != a["sha256"]:
                  raise SystemExit(f"sha256 mismatch for {a['dest']}: got {digest} want {a['sha256']}")
              dest = Path(a["dest"])
              dest.parent.mkdir(parents=True, exist_ok=True)
              if dest.exists() and dest.read_bytes() == data:
                  print(f"ok unchanged {a['dest']}")
                  continue
              dest.write_bytes(data)
              changed.append(a["dest"])
              print(f"wrote {a['dest']} ({len(data)} bytes)")
          Path("/tmp/changed.txt").write_text("\n".join(changed) + ("\n" if changed else ""))
          print(f"changed={len(changed)}")
          PY
      - name: Commit assembled files
        run: |
          set -euo pipefail
          if [ ! -s /tmp/changed.txt ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "mehmet turac"
          git config user.email "mehmetturac@gmail.com"
          while IFS= read -r f || [ -n "${f:-}" ]; do
            [ -n "${f:-}" ] || continue
            git add -f -- "$f"
            echo "staged $f"
          done < /tmp/changed.txt
          git status
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "nothing staged"
            exit 0
          fi
          git commit -m "chore: import AgentForge from OpenTheBot main"
          git push
